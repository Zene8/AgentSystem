# OPTIONAL customization for the daily-briefing triage. Not required — by default
# the skill triages into spam / actionable / FYI on its own: spam -> Trash
# (recoverable, auto-OK), actionable -> a Notion Task, FYI -> label + summarise,
# and email replies are NEVER auto-sent (drafts only, on request).
#
# Use this file only to override defaults for specific senders/subjects. Copy to
# ~/life/triage-rules.yml and edit. Missing file => the built-in behaviour above.
#
# Evaluation: first matching rule wins, top to bottom. No match => built-in triage.
# mode: suggest  -> only proposed in the digest, never acted on.
# mode: auto     -> acted on automatically. Sending email stays gated/off (see below).

defaults:
  mode: suggest          # global default until you trust it; flip individual rules to auto
  allow_send: false      # master kill-switch for sending email to humans
  allow_archive: false   # master kill-switch for archiving/removing from inbox

# AUTO-SEND is the one irreversible action with a hard extra gate. A reply is sent
# automatically ONLY when ALL of: the matched rule is mode:auto AND allow_send:true
# AND the recipient is in trusted_senders below. Anyone not listed => draft only.
# Empty list = auto-send disabled entirely (the safe default). Add addresses you
# genuinely trust an agent to reply to on your behalf.
trusted_senders: []
  # - chris@arborgenie.com
  # - team@arborgenie.com

rules:
  - name: newsletters
    match:               # all conditions must hold
      from_contains: ["newsletter@", "noreply@", "no-reply@"]
    action: archive      # archive | label:<name> | draft-reply | none
    mode: suggest        # -> set auto once you trust it (needs allow_archive: true)

  - name: receipts-and-invoices
    match:
      subject_contains: ["receipt", "invoice", "payment"]
    action: label:Finance
    mode: suggest

  - name: recruiter-spam
    match:
      subject_contains: ["opportunity", "reaching out", "quick chat"]
    action: archive
    mode: suggest

  # Example of a trusted auto rule (still won't send unless allow_send: true above):
  # - name: internal-standup-drafts
  #   match: { from_contains: ["team@arborgenie.com"] }
  #   action: draft-reply
  #   mode: auto
