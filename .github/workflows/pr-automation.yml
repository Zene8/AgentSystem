name: PR & Issue Automation

# Deterministic bookkeeping only -- zero model/claude CLI calls (issue #158).
# Runs on the hosted runner (not self-hosted) so it never depends on the
# self-hosted runner's availability (see #115 single-point-of-failure note
# in CLAUDE.md). Pure gh CLI + github-script string/JSON operations.

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-opened:
    if: github.event_name == 'pull_request'
    name: Autolink PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # A branch name is a STRING, not a guarantee that the issue exists. `issue-747-not-planned-close`
      # (PR #453) matched the regex, resolved to nothing, and the `gh issue view 747` two steps down
      # exited 1 under this job's `-e` shell -- turning deterministic bookkeeping into a red run and an
      # email (#457). So the number is resolved here, ONCE, and an unresolvable one is reported as
      # absent so both downstream steps skip on their existing `!= ''` guards.
      #
      # This is NOT the unlinked-PR gate and must never become one. `pr-linked-issue-check.yml` is the
      # required check that fails an unlinked PR, and it already reported #453 correctly; a second
      # failure here adds no signal and one more email.
      - name: Extract linked issue number from head branch
        id: linked
        run: |
          set -uo pipefail
          BRANCH="${HEAD_REF}"
          if [[ ! "$BRANCH" =~ issue-([0-9]+) ]]; then
            echo "Branch '$BRANCH' carries no issue-<N> segment — nothing to autolink."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          N="${BASH_REMATCH[1]}"

          # `gh issue view` resolves pull requests too -- they share the numbering space -- so ask for
          # the type as well and accept only a real Issue. Same distinction pr-linked-issue-check.yml
          # draws, for the same reason: `Closes #<pr>` is a typo, not a link.
          if ! RESOLVED=$(gh api "repos/${REPO}/issues/${N}" --jq '.pull_request | if . then "pr" else "issue" end' 2>&1); then
            echo "::notice::Branch-derived issue #${N} does not resolve in ${REPO} — skipping label/milestone copy (gh said: ${RESOLVED})"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RESOLVED" != "issue" ]; then
            echo "::notice::#${N} resolves to a pull request, not an issue — skipping label/milestone copy"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Branch '$BRANCH' -> issue #${N} (resolved)."
          echo "issue_number=${N}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}

      - name: Append "Closes #N" to PR body if absent
        if: steps.linked.outputs.issue_number != ''
        run: |
          ISSUE_NUM="${{ steps.linked.outputs.issue_number }}"
          BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body // ""')
          if echo "$BODY" | grep -qiE "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#${ISSUE_NUM}\b"; then
            echo "Body already references #${ISSUE_NUM} — no change"
          else
            NEW_BODY=$(printf '%s\n\nCloses #%s\n' "$BODY" "$ISSUE_NUM")
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --body "$NEW_BODY"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Bookkeeping, not a gate (#457): a transient API error here must not produce a red run.
        continue-on-error: true

      - name: Copy labels + milestone from linked issue
        if: steps.linked.outputs.issue_number != ''
        run: |
          ISSUE_NUM="${{ steps.linked.outputs.issue_number }}"

          LABELS=$(gh issue view "${ISSUE_NUM}" --repo "${REPO}" --json labels --jq '[.labels[].name] | join(",")')
          if [ -n "$LABELS" ]; then
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "$LABELS"
          fi

          MILESTONE=$(gh issue view "${ISSUE_NUM}" --repo "${REPO}" --json milestone --jq '.milestone.title // ""')
          if [ -n "$MILESTONE" ]; then
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --milestone "$MILESTONE"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Bookkeeping, not a gate (#457): a transient API error here must not produce a red run.
        continue-on-error: true

      - name: Add spec/implementation label based on branch/title
        run: |
          # Check if this is a spec/plan PR
          if [[ "$BRANCH" =~ issue-[0-9]+-spec ]] || [[ "$TITLE" =~ ^\[(Spec|Plan)\] ]]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label spec
            echo "Added 'spec' label"
          # Check if this is an implementation PR (has issue number but NOT spec)
          elif [[ "$BRANCH" =~ issue-[0-9]+- ]] && ! [[ "$BRANCH" =~ issue-[0-9]+-spec ]]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label implementation
            echo "Added 'implementation' label"

            # Try to find linked spec PR for this issue
            if [[ "$BRANCH" =~ issue-([0-9]+) ]]; then
              ISSUE_NUM="${BASH_REMATCH[1]}"
              # Search for spec PRs for this issue
              SPEC_PR=$(gh pr list --repo "$REPO" --search "issue-${ISSUE_NUM}-spec in:head" --json number --jq '.[0].number // empty')
              if [ -z "$SPEC_PR" ]; then
                # Fallback: search by title for [Spec] or [Plan] mentioning the issue
                SPEC_PR=$(gh pr list --repo "$REPO" --search "#${ISSUE_NUM} [Spec] OR #${ISSUE_NUM} [Plan]" --json number --jq '.[0].number // empty')
              fi
              if [ -n "$SPEC_PR" ]; then
                gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Implementation PR for spec/plan PR #${SPEC_PR}."
                echo "Linked to spec PR #$SPEC_PR"
              fi
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        continue-on-error: true
